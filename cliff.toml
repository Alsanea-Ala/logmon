# Git-cliff configuration for CHANGELOG.md.
#
# Only rendering lives here. The version number is decided by
# .github/workflows/release-tag.yml, which applies an explicit rules table to
# the commits since the previous `chore: vX.Y.Z` commit. Deciding the bump in
# shell rather than in this file is deliberate: a rules table you can read is
# easier to review than a commit-parser config that derives versions
# indirectly.
#
# Releases are added with `--prepend`, not `--output`. That is not a
# preference. `--unreleased --output CHANGELOG.md` renders *only* the
# unreleased commits as a single release, so the second release would rewrite
# the file down to one section and every earlier version would be gone.
# Verified against this repo's history with v2.14.2: with a tag present,
# `--output` emitted `## [0.1.1]` and dropped `## [0.1.0]`.
#
# --prepend inserts each new section above the previous ones and leaves the
# header alone, so the header below is written once by hand and never touched
# again. The end-of-header marker is what --prepend anchors on; without it
# there is nowhere to insert.
#
# Preview locally:  git cliff --unreleased
# Render a release: git cliff --unreleased --tag v0.2.0 --prepend CHANGELOG.md

[changelog]
# The header. Kept in step with the header of the committed CHANGELOG.md by
# hand, because --prepend never rewrites it.
header = """
# Changelog

All notable changes to this project are recorded here. Versions follow
[Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/); the
rules that map commits to versions are in [CONTRIBUTING.md](CONTRIBUTING.md).

<!--
Release sections below this line are inserted by git-cliff from cliff.toml on
every release. Edit the header above by hand; edit nothing below the marker.
-->

<!-- git-cliff: end of header -->
"""

# git-cliff's own body template, verbatim. Every filter it names is registered
# by the binary that renders it, which is not something that can be said for a
# template written from memory: `shorten` and `striptag` were both invented
# here and both failed at render time. Only `commit_groups` is changed, to
# drop an argument that would be empty for the parsers below.
#
# The trailing backslashes are a TOML line-ending escape, not a template
# feature. They are what keeps the rendered markdown free of stray blank lines.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim | upper_first }}
{% for commit in entry.commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""

# git-cliff's own defaults, written out so they are not silently inherited.
trim = true
# Render the body even when there are no releases to process, so a range with
# nothing releasable still produces a valid file rather than nothing at all.
render_always = true

[git]
conventional_commits = true
# `filter_unconventional`, not `filter_out_unconventional`. The wrong spelling
# is not rejected: git-cliff's Config has no deny_unknown_fields, so the key
# is ignored and this silently inherited `true` from the embedded default
# config, quietly dropping any non-conventional commit from the file.
filter_unconventional = false
filter_commits = false

# Single-quoted TOML literal strings throughout: a basic string treats \( and
# \) as invalid escape sequences, so every regex here would fail to parse.
# In a literal string the backslashes are regex backslashes and nothing else.
#
# The first three name the groups that survive, which both improves the
# headings and gives commit_groups(groups=...) an explicit order to sort by.
# Without a group, the conventional parser falls back to the bare commit type
# and sections render as "Feat" and "Fix" in whatever order they first appear.
commit_parsers = [
  { message = '^feat(?:\(.*\))?!?:', group = 'Features' },
  { message = '^fix(?:\(.*\))?!?:', group = 'Bug Fixes' },
  { message = '^perf(?:\(.*\))?!?:', group = 'Performance' },

  # Drops the types that never produce a release, mirroring the
  # changelog.filters.exclude list in .goreleaser.yaml so the file and the
  # published release notes agree. `ref` is legacy but still in history.
  #
  # These commits are still read by the bump decision in release-tag.yml;
  # excluding them here only keeps them out of the rendered file.
  { message = '^ref(?:\(.*\))?!?:', skip = true },
  { message = '^chore(?:\(.*\))?!?:', skip = true },
  { message = '^docs(?:\(.*\))?!?:', skip = true },
  { message = '^ci(?:\(.*\))?!?:', skip = true },
  { message = '^build(?:\(.*\))?!?:', skip = true },
  { message = '^test(?:\(.*\))?!?:', skip = true },
  { message = '^style(?:\(.*\))?!?:', skip = true },
]

# The version boundary is the tag, not the release commit, so an untagged
# range is exactly what has not shipped.
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'

# Order releases topologically rather than chronologically.
#
# There is no `sort` key here. GitConfig has sort_commits (newest|oldest, the
# order of commits *within* a section) and topo_order (the order of releases).
# A `sort = "topo"` line would be ignored without complaint.
topo_order = true
topo_order_commits = true
