# Git-cliff configuration for CHANGELOG.md.
#
# Only rendering lives here. The version number is decided by
# .github/workflows/release-tag.yml, which applies an explicit rules table to
# the commits since the previous `chore: vX.Y.Z` commit. Deciding the bump in
# shell rather than in this file is deliberate: a rules table you can read is
# easier to review than a commit-parser config that derives versions
# indirectly.
#
# The workflow regenerates the whole file with --output on every release, so
# nothing here has to survive a merge by hand. git-cliff's default `--output`
# behaviour rebuilds the file from git history rather than editing it, which is
# why `--prepend` is not used.
#
# Preview locally:  git cliff --unreleased
# Render a release: git cliff --unreleased --tag v0.2.0 --output CHANGELOG.md

[changelog]
# Rendered once at the top of the file, on every regeneration. The
# "do not edit by hand" warning lives here rather than in CHANGELOG.md
# because --output overwrites that file completely; a note written into
# CHANGELOG.md itself is destroyed by the first release.
header = """
# Changelog

All notable changes to this project are recorded here. Versions follow
[Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/); the
rules that map commits to versions are in [CONTRIBUTING.md](CONTRIBUTING.md).

<!--
Generated by git-cliff from cliff.toml. Do not edit this file by hand: each
release rewrites it from the commit history.
-->
"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}
- {{ commit.id | shorten }} {{ commit.message | upper_first }}
{%- endfor %}

{% endfor %}
"""
footer = ""

# git-cliff's own defaults, written out because a template that renders
# ragged whitespace produces a changelog with stray blank lines.
trim = true
# Render the body even when there are no releases to process, so a range with
# nothing releasable still produces a valid file rather than nothing at all.
render_always = true

[git]
conventional_commits = true
# `filter_unconventional`, not `filter_out_unconventional`. The wrong spelling
# is not rejected: git-cliff's Config has no deny_unknown_fields, so the key
# is ignored and this silently inherited `true` from the embedded default
# config, quietly dropping any non-conventional commit from the file.
filter_unconventional = false
filter_commits = false

# Single-quoted TOML literal strings throughout: a basic string treats \( and
# \) as invalid escape sequences, so every regex here would fail to parse.
# In a literal string the backslashes are regex backslashes and nothing else.

# Drops the types that never produce a release, mirroring the
# changelog.filters.exclude list in .goreleaser.yaml so the file and the
# published release notes agree. `ref` is legacy but still in history.
#
# These commits are still read by the bump decision in release-tag.yml;
# excluding them here only keeps them out of the rendered file.
commit_parsers = [
  { message = '^ref(?:\(.*\))?!?:', skip = true },
  { message = '^chore(?:\(.*\))?!?:', skip = true },
  { message = '^docs(?:\(.*\))?!?:', skip = true },
  { message = '^ci(?:\(.*\))?!?:', skip = true },
  { message = '^build(?:\(.*\))?!?:', skip = true },
  { message = '^test(?:\(.*\))?!?:', skip = true },
  { message = '^style(?:\(.*\))?!?:', skip = true },
]

# The version boundary is the tag, not the release commit, so an untagged
# range is exactly what has not shipped.
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'

# Order releases topologically rather than chronologically.
#
# There is no `sort` key here. GitConfig has sort_commits (newest|oldest, the
# order of commits *within* a section) and topo_order (the order of releases).
# A `sort = "topo"` line would be ignored without complaint.
topo_order = true
topo_order_commits = true
