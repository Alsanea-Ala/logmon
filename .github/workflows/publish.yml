name: publish

# One entry point:
#
#   push tags ["v*"]     the only entry point. release-tag.yml pushes with
#                        ACTIONS_PUSH_TOKEN, a personal token rather than
#                        GITHUB_TOKEN, precisely because main requires a pull
#                        request and the bot cannot bypass it. A push by a
#                        personal token is not suppressed the way a
#                        GITHUB_TOKEN push is, so this fires directly and no
#                        repository_dispatch is needed to reach this workflow.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Required. GoReleaser builds the changelog from commit history;
          # a shallow clone makes it emit nothing or fail outright.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Required. GoReleaser reads its publish token from this variable,
          # or from ~/.config/goreleaser/github_token. Neither exists on a
          # runner, so without this the publish step fails. The contents: write
          # permission above is what makes this token able to create a release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: dist/checksums.txt
