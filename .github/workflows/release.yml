name: release

# Tag-driven only. Nothing in CI creates or pushes tags; a human decides the
# version and runs:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# That keeps a reviewed human between "version chosen" and "binary published".
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: build + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Required. GoReleaser builds the changelog from commit history;
          # a shallow clone makes it emit nothing or fail outright.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean

      - uses: actions/upload-artifact@v6
        with:
          name: checksums
          path: dist/checksums.txt