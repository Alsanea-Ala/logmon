name: release-tag

# Gated on ci.yml rather than duplicating it. workflow_run fires for every
# ci.yml completion, including branch pushes, so the head_branch check is what
# keeps a release off anything that is not main.
#
# Requires a repository secret this file cannot create: ACTIONS_PUSH_TOKEN, a
# fine-grained token belonging to an account with admin rights on this repo.
#
# main has a "changes must be made through a pull request" rule, so a push with
# GITHUB_TOKEN fails GH006. The bypass route was tried and does not work for a
# workflow: github-actions[bot] is not selectable in a ruleset bypass list, and
# classic branch protection offers no actor picker for an app. An admin account
# does bypass, so the push uses that account's token instead.
#
# The commit being pushed only ever changes CHANGELOG.md, which is why letting
# it through without a review is reasonable. See CONTRIBUTING.md, "Releases".
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  release:
    name: bump, changelog, tag
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Required. The range since the last release commit needs the whole
          # history; a shallow clone makes the commit range and the changelog
          # both come out wrong.
          fetch-depth: 0
          # workflow_run checks out the default branch by default, not the
          # commit that was actually tested.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Required, not cosmetic. By default checkout writes an
          # http.<github>.extraheader holding GITHUB_TOKEN into .git/config,
          # and that header outranks anything the remote URL carries: the push
          # authenticates as github-actions[bot] no matter what the URL says.
          # Reproduced against a local server that challenges for auth -- with
          # both set, only the bot's Authorization header is ever sent, which is
          # why an earlier attempt to fix this with `git remote set-url` pushed
          # as the bot and still hit GH006. The push step sets its own header
          # through GIT_CONFIG_*, and that only wins if checkout has not left
          # one behind.
          #
          # Safe here because this job makes no authenticated remote calls
          # after checkout: the tag check is a local `git rev-parse`, and the
          # repository is public.
          persist-credentials: false

      # Deliberately after the bump step, not before it: the action runs
      # git-cliff itself (there is no install-only mode on v4 -- the valid
      # inputs are version, config, args and github_token), so it needs the
      # version that step computes.

      # Publishes `version` only when the range is actually release-worthy.
      # Every later step is gated on that output being non-empty, so leaving it
      # unset is what makes this job a no-op instead of a failed run.
      - id: bump
        name: classify commits and compute the next version
        run: |
          set -euo pipefail

          # ---- range --------------------------------------------------
          # The previous release commit is the boundary. Its subject is
          # exactly "chore: vX.Y.Z", so match that and nothing looser.
          #
          # With no previous release, every commit is in range. That is an
          # absent range argument, not a root-based one: the root commit has
          # no parent, so "<root>^..HEAD" is not a valid revision and fails
          # the whole job on exactly the run that most needs to work.
          # grep -m1 rather than `| head -1`: head exits at the first line and
          # SIGPIPEs grep, which pipefail reports as failure.
          LAST=$(git log --format='%H %s' \
            | grep -m1 -E '^[0-9a-f]{40} chore: v[0-9]+\.[0-9]+\.[0-9]+$' \
            | cut -d' ' -f1 || true)
          RANGE=${LAST:+"$LAST^..HEAD"}
          echo "range: ${RANGE:-all commits on this branch}"

          # ---- one snapshot of the subjects ---------------------------
          # Every rule below greps this variable through a here-string
          # instead of running a fresh `git log | grep -q` pipeline.
          #
          # That is not a style preference. `grep -q` exits the moment it
          # matches; git log then dies of SIGPIPE with status 141, and under
          # `set -o pipefail` the pipeline reports failure. So a range that
          # does contain a feat looks identical to one that does not, every
          # rule evaluates false, and the job exits 0 without tagging
          # anything -- a release pipeline that silently never releases.
          # Reproduced against the real 30-commit history; it does not
          # reproduce in a small synthetic repo, where git log finishes
          # writing before grep -q exits.
          SUBJECTS=$(git log --format='%s' $RANGE)

          # ---- rules --------------------------------------------------
          # only docs ref ci chore build  ->  no release
          # fix or perf                   ->  patch
          # feat                           ->  minor
          # "!" in the subject, or a BREAKING CHANGE footer  ->  major
          #
          # Major is tested first so it wins over the others.
          #
          # A footer cannot be found by grepping the subject, and a substring
          # match over the whole message false-positives: commit f2e9360
          # quotes the phrase inside a fenced code block. Testing only the
          # last line of the final paragraph is footer-correct and rejects
          # that commit. Verified against all of main: zero real footers.
          # Same trap as above: `... | grep -q .` would SIGPIPE awk and read a
          # genuine BREAKING CHANGE footer as absent, quietly cutting a patch
          # where a major was required. Command substitution reads to the end
          # and has no pipeline to fail.
          BREAKING=false
          for sha in $(git log --format='%H' $RANGE); do
            FOOTER=$(awk 'BEGIN{RS=""} NF{n=split($0,L,"\n");
                                    if (L[n] ~ /^BREAKING[ -]CHANGE:/) print L[n]}' \
                     <<<"$(git log -1 --format='%B' "$sha")")
            if [ -n "$FOOTER" ]; then
              echo "breaking: $(git log -1 --format='%h %s' "$sha")"
              BREAKING=true
              break
            fi
          done

          # $RANGE stays unquoted: empty means every commit, and quoting it
          # would pass an empty-string revision to git.
          if [ "$BREAKING" = true ] \
            || grep -qE '^[a-z]+(\([^)]+\))?!:' <<<"$SUBJECTS"; then
            BUMP=major
          elif grep -qE '^feat(\([^)]+\))?:' <<<"$SUBJECTS"; then
            BUMP=minor
          elif grep -qE '^(fix|perf)(\([^)]+\))?:' <<<"$SUBJECTS"; then
            BUMP=patch
          else
            BUMP=none
          fi

          if [ "$BUMP" = none ]; then
            echo "no release-worthy commit in this range, stopping"
            # A real exit, not a printed one. This used to be
            # `echo "$NO_RELEASE"` with NO_RELEASE="exit 0", which wrote the
            # text to stdout and fell through -- so the job went on to compute
            # a version from the range it had just rejected, and shipped
            # whatever the old tag implied. Printing a command is not running
            # it, and nothing in the log said otherwise.
            #
            # Exiting 0 rather than 1 is deliberate: a range of docs and chore
            # commits is not a failure. But it only skips THIS step, so the
            # steps after it carry `if: steps.bump.outputs.version != ''`.
            # `version` is never written on this path, so those steps skip.
            exit 0
          fi

          # ---- version ------------------------------------------------
          # The first release is v0.1.0 whatever the history says; applying
          # the rules to it would derive v0.2.0 from a 0.1.0 base that never
          # existed.
          if [ -z "$LAST" ] && [ -z "$(git tag -l 'v*')" ]; then
            VERSION=v0.1.0
          else
            BASE=$(git describe --tags --abbrev=0 | sed 's/^v//')
            IFS=. read -r MAJ MI PA <<<"$BASE"
            case "$BUMP" in
              major) MAJ=$((MAJ+1)); MI=0; PA=0 ;;
              minor) MI=$((MI+1));  PA=0 ;;
              patch) PA=$((PA+1)) ;;
            esac
            VERSION="v$MAJ.$MI.$PA"
          fi
          echo "bump: $BUMP -> $VERSION"

          # Refuse to reuse a version that is already tagged, rather than
          # letting `git tag -a` fail three steps later with a bare
          # "fatal: tag 'vX.Y.Z' already exists" that does not say why. A
          # collision means the previous release did not land as intended --
          # usually a release commit missing from main -- so say so instead of
          # failing obscurely three steps later.
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists; refusing to reuse it" >&2
            echo "check whether that release's chore commit reached main" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Adds the new release above the existing ones.
      #
      # --prepend, not --output. `--unreleased --output CHANGELOG.md` renders
      # only the unreleased commits as a single release, so the second release
      # would truncate the file to one section and erase every earlier
      # version. Confirmed with v2.14.2 against this repo's history.
      #
      # No OUTPUT env on purpose. The action's run.sh always exports
      # GIT_CLIFF_OUTPUT, and git-cliff rejects the combination outright:
      #   ArgumentError("'-o' and '-p' can only be used together if they
      #                   point to different files")
      # Its default, git-cliff/CHANGELOG.md, differs from the prepend target,
      # which is what has to happen. run.sh mkdirs it before invoking.
      - name: update CHANGELOG.md
        # Skipped when the bump step found nothing to release. `exit 0` in that
        # step skips only itself, so without this guard the remaining steps
        # would still run against an empty version.
        if: steps.bump.outputs.version != ''
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # Pinned rather than left to the action's default, so a bump in
          # upstream does not silently change what renders this file.
          version: v2.14.2
          args: --unreleased --tag ${{ steps.bump.outputs.version }} --prepend CHANGELOG.md -v

      # The checkout above leaves a detached HEAD, because workflow_run
      # checks out a sha rather than a branch. Every git command in the next
      # step would then work against a detached ref, so name it before use.
      - name: attach the tested commit to a branch
        if: steps.bump.outputs.version != ''
        run: git checkout -B "release/${{ steps.bump.outputs.version }}"

      # Proves the secret exists and which account it acts as, before anything is
      # pushed. If this does not print Alsanea-Ala the secret is missing,
      # expired, or misnamed, and no amount of push configuration helps.
      # DELETE once a release has gone green.
      - name: whoami (TEMP, delete after first green release)
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
        run: gh api user -q .login

      - name: commit, tag, push
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          ACTIONS_PUSH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ACTIONS_PUSH_TOKEN:-}" ]; then
            echo "ACTIONS_PUSH_TOKEN secret is missing or empty" >&2
            exit 1
          fi

          # The runner checkout has no identity configured.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          # --allow-empty, unconditional. The next bump reads this commit's
          # subject as its range boundary, so it has to exist even when every
          # commit in the range is filtered out of CHANGELOG.md and the file
          # came back unchanged. Without it a future release whose range is
          # entirely excluded would exit 1 here and never tag.
          git commit --allow-empty -m "chore: $VERSION"

          # Retry/rerun safety: if the tag already points at this commit, keep
          # going; if it points elsewhere, fail rather than retagging.
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            TAG_TARGET=$(git rev-parse "refs/tags/$VERSION^{}")
            HEAD_TARGET=$(git rev-parse HEAD)
            if [ "$TAG_TARGET" != "$HEAD_TARGET" ]; then
              echo "tag $VERSION already exists on $TAG_TARGET (expected $HEAD_TARGET)"
              exit 1
            fi
          else
            git tag -a "$VERSION" -m "Release $VERSION"
          fi

          # Two ordered pushes, never one `git push HEAD:main --follow-tags`.
          #
          # That single form pushes the tag first, so a rejected branch push
          # still leaves a published tag pointing at a commit that never
          # reached main -- an unreleasable tag with no GitHub Release behind
          # it, which is the state the v0.1.0 run got into. Under set -e a
          # failed first push exits here, before the tag exists remotely.

          # Push as the token's owner, not as github-actions[bot].
          #
          # main requires a pull request, and GITHUB_TOKEN cannot bypass it:
          # github-actions[bot] is not selectable in a ruleset bypass list, and
          # classic branch protection has no actor picker for an app at all.
          # An admin account does bypass, so ACTIONS_PUSH_TOKEN -- a
          # fine-grained token belonging to one -- can.
          #
          # The header goes in through GIT_CONFIG_*, which keeps it out of
          # .git/config, out of argv and out of ps. An earlier attempt used
          # `git remote set-url`, which is worse twice over: the PAT lands in
          # .git/config for the rest of the job, and it does not even change
          # who the push authenticates as, because an extraheader left by
          # checkout outranks the URL. checkout is now told not to write one.
          AUTH="$(printf 'x-access-token:%s' "$ACTIONS_PUSH_TOKEN" | base64 -w0)"
          # Actions auto-masks the raw secret but not this base64 form.
          echo "::add-mask::$AUTH"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"

          git push origin HEAD:main
          git push origin "refs/tags/$VERSION"

          # No repository_dispatch here.
          #
          # It was needed while the push used GITHUB_TOKEN: GitHub suppresses
          # workflow runs for refs created by the token, so the tag push fired
          # nothing and the dispatch was the only way to reach publish.yml.
          #
          # The push now uses ACTIONS_PUSH_TOKEN, which is an ordinary user
          # credential and is not suppressed. The tag push therefore triggers
          # publish.yml directly, and dispatching on top of that would start a
          # second goreleaser run against a release that already exists.
          #
          # One consequence worth knowing: ci.yml now also runs for the release
          # commit, which it did not before. That is harmless. The release
          # commit is "chore: vX.Y.Z", so the next bump finds it as its
          # boundary, sees a range of nothing, and skips.
